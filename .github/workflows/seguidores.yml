name: seguidores

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seguidores
  cancel-in-progress: false

jobs:
  seguidores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: foto do total de seguidores
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 seguidores.py

      - name: guardar
        run: |
          if [ -n "$(git status --porcelain seguidores.csv)" ]; then
            git config user.name "agendador"
            git config user.email "agendador@users.noreply.github.com"
            git add seguidores.csv
            git commit -m "seguidores: $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --quiet origin main
            git push
          fi
