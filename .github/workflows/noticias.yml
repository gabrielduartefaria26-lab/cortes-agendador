name: pautas quentes

# Pauta quente de vendas e gestão (Google Notícias, Brasil e EUA), 07h e 15h em Brasília.
# Grava quentes.json; o quadro do @gabrieldfaria_ lê daqui.
on:
  schedule:
    - cron: "23 10,18 * * *"   # 07:23 e 15:23 em Brasília; fora da hora cheia, que o GitHub costuma pular
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ler as buscas de vendas
        run: python3 noticias.py
      - name: guardar
        run: |
          if [ -n "$(git status --porcelain vistos.json quentes.json)" ]; then
            git config user.name "agendador"
            git config user.email "agendador@users.noreply.github.com"
            git add vistos.json quentes.json
            git commit -m "noticias: $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --quiet origin main
            git push
          fi
