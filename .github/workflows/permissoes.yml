name: conferir permissoes do token
# Só lista as permissões que o token do agendador tem (nunca imprime o token).
on: workflow_dispatch
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          echo "== permissões =="
          curl -s "https://graph.facebook.com/v21.0/me/permissions?access_token=$IG_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(p['permission'],p['status']) for p in d.get('data',[])] or print(d)"
          echo "== quem é =="
          curl -s "https://graph.facebook.com/v21.0/me?fields=id,name&access_token=$IG_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);print({k:v for k,v in d.items() if k!='id'}, 'tipo:', 'erro' if 'error' in d else 'ok')"
          echo "== comentários do último post (só conta) =="
          M=$(curl -s "https://graph.facebook.com/v21.0/$IG_USER_ID/media?fields=id,comments_count&limit=1&access_token=$IG_TOKEN")
          echo "$M" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data') and {'comments_count':d['data'][0].get('comments_count')} or d.get('error',{}).get('message'))"
          ID=$(echo "$M" | python3 -c "import sys,json;print(json.load(sys.stdin)['data'][0]['id'])")
          curl -s "https://graph.facebook.com/v21.0/$ID/comments?fields=id,text,timestamp&limit=3&access_token=$IG_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);print('leitura de comentarios:', 'ok' if 'data' in d else d.get('error',{}).get('message'))"
