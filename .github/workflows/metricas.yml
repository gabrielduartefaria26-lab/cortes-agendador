name: metricas

on:
  schedule:
    - cron: "13 11 * * *"   # 08:13 em Brasilia; fora da hora cheia, que o GitHub costuma pular
  workflow_dispatch:

permissions:
  contents: write

# grupo proprio: no grupo da publicacao, todo plantao novo cancelava a coleta (24/09 ficou
# sem metricas). So mexe no metricas.csv, e o pull --rebase antes do push resolve o resto.
concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: puxar os numeros de todos os posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 metricas.py

      - name: guardar
        run: |
          if [ -n "$(git status --porcelain metricas.csv)" ]; then
            git config user.name "agendador"
            git config user.email "agendador@users.noreply.github.com"
            git add metricas.csv
            git commit -m "metricas: $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi
